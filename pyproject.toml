[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trilith-core"
version = "0.1.0"
description = "An open-source, language-agnostic context management layer for AI systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Umair khan" }
]
keywords = ["ai", "context", "memory", "mcp", "grpc", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "grpcio>=1.60.0",
  "protobuf>=4.25.0",
  "grpcio-tools>=1.60.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "black>=24.0",
]
mcp = [
  "mcp[cli]>=1.0",
]
server = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
]
langchain = [
  "langchain-core>=0.2.0",
]
openai-agents = [
  "openai-agents>=0.0.14",
]
claude = [
  "anthropic>=0.40.0",
]
adapters = [
  "langchain-core>=0.2.0",
  "openai-agents>=0.0.14",
  "anthropic>=0.40.0",
]

[project.scripts]
trilith = "core.cli:main"

[project.urls]
Homepage = "https://github.com/Umairkhan2324/trilith"
Repository = "https://github.com/Umairkhan2324/trilith"
Issues = "https://github.com/Umairkhan2324/trilith/issues"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
